name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Codegen, lint, typecheck, test, build, and pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Generate Nitro bindings (nitrogen + post-codegen patches)
        run: npm run codegen
      - name: Verify generated bindings are committed
        run: git diff --exit-code -- packages/munim-xr/nitrogen/generated
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit tests (Expo config plugin)
        run: npm test
      # The example imports munim-xr through its built `lib/` types, so build first.
      - run: npm run build
      - run: npm run typecheck:example
      - name: Validate Expo prebuild configuration
        run: npx expo config --type prebuild > /dev/null
        working-directory: example
      - run: npm run pack:dry-run
