name: Build iOS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ios-build.yml'
      - 'package*.json'
      - 'example/**'
      - 'packages/munim-xr/ios/**'
      - 'packages/munim-xr/nitrogen/**'
      - 'packages/munim-xr/src/**'
      - 'packages/munim-xr/scripts/**'
      - 'packages/munim-xr/app.plugin.js'
      - 'packages/munim-xr/*.podspec'
      - 'packages/munim-xr/nitro.json'
      - 'packages/munim-xr/package.json'
  pull_request:
    paths:
      - '.github/workflows/ios-build.yml'
      - 'package*.json'
      - 'example/**'
      - 'packages/munim-xr/ios/**'
      - 'packages/munim-xr/nitrogen/**'
      - 'packages/munim-xr/src/**'
      - 'packages/munim-xr/scripts/**'
      - 'packages/munim-xr/app.plugin.js'
      - 'packages/munim-xr/*.podspec'
      - 'packages/munim-xr/nitro.json'
      - 'packages/munim-xr/package.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iOS example (Xcode ${{ matrix.xcode }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Swift 6.2/6.3: the iOS 27 code paths must compile out
          # (`#if compiler(>=6.4)`).
          - runner: macos-26
            xcode: '26.6'
          # Swift 6.4 + iOS 27 SDK: the iOS 27 face environment texturing compiles in.
          - runner: xcode-27
            xcode: '27.0'
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Generate iOS project
        run: npx expo prebuild --platform ios --clean --no-install
        working-directory: example
      - run: pod install
        working-directory: example/ios
      - name: Build simulator app
        run: |
          set -o pipefail
          xcodebuild \
            -workspace MunimXRExample.xcworkspace \
            -scheme MunimXRExample \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
        working-directory: example/ios
