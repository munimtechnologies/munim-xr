name: Build iOS

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ios-build.yml"
      - "package.json"
      - "package-lock.json"
      - "example/**"
      - "packages/munim-xr/ios/**"
      - "packages/munim-xr/nitrogen/generated/ios/**"
      - "packages/munim-xr/nitrogen/generated/shared/**"
      - "packages/munim-xr/src/**"
      - "packages/munim-xr/package.json"
      - "packages/munim-xr/app.plugin.js"
      - "packages/munim-xr/*.podspec"
      - "packages/munim-xr/nitro.json"
      - "packages/munim-xr/react-native.config.js"
  pull_request:
    paths:
      - ".github/workflows/ios-build.yml"
      - "package.json"
      - "package-lock.json"
      - "example/**"
      - "packages/munim-xr/ios/**"
      - "packages/munim-xr/nitrogen/generated/ios/**"
      - "packages/munim-xr/nitrogen/generated/shared/**"
      - "packages/munim-xr/src/**"
      - "packages/munim-xr/package.json"
      - "packages/munim-xr/app.plugin.js"
      - "packages/munim-xr/*.podspec"
      - "packages/munim-xr/nitro.json"
      - "packages/munim-xr/react-native.config.js"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iOS example
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate iOS project
        run: npx expo prebuild --platform ios --clean --no-install
        working-directory: example

      - name: Install CocoaPods dependencies
        run: pod install
        working-directory: example/ios

      - name: Build simulator app
        run: |
          set -o pipefail
          xcodebuild \
            -workspace MunimXRExample.xcworkspace \
            -scheme MunimXRExample \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
        working-directory: example/ios
